name: Publish npm

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag npm (ex. latest, next) — défaut latest'
        required: false
        default: latest
      skip_npm_publish:
        description: 'Ne publier que le tarball (sans npm publish)'
        required: false
        type: boolean
        default: false

defaults:
  run:
    working-directory: ted

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ted/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create npm tarball
        run: npm pack

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: ted-npm-release
          path: ted/ted-*.tgz
          retention-days: 365

      - name: Attach tarball to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ted/ted-*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: github.event.inputs.skip_npm_publish != 'true'
        run: npm publish --provenance --access public --tag "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || 'latest' }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
