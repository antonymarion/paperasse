<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TED</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --accent: #3b82f6;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header h1 { font-size: 1.1rem; margin: 0; }
    header span { color: var(--muted); font-size: 0.85rem; }
    main { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 57px); }
    aside, section { padding: 1rem; }
    aside { border-right: 1px solid var(--border); background: var(--panel); }
    input, textarea, button {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      margin-bottom: 0.5rem;
    }
    button {
      background: var(--accent);
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary { background: transparent; border: 1px solid var(--border); }
    .stats { font-size: 0.8rem; color: var(--muted); line-height: 1.6; }
    .hit {
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 0.5rem;
      cursor: pointer;
    }
    .hit:hover { border-color: var(--accent); }
    .hit .label { font-size: 0.7rem; color: var(--accent); text-transform: uppercase; }
    #graph-view {
      height: 420px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: auto;
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      padding: 0.75rem;
      background: #0a0e14;
    }
    .citations { margin-top: 1rem; }
    .citation {
      border-left: 3px solid var(--accent);
      padding-left: 0.75rem;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>TED</h1>
    <span>Ontologie skills · Ladybug · inspiré GitNexus</span>
  </header>
  <main>
    <aside>
      <div class="stats" id="status">Chargement…</div>
      <hr style="border-color: var(--border)" />
      <input id="query" placeholder="Rechercher (ex: TVA, 2033, dividendes)" />
      <button id="search">Rechercher</button>
      <button class="secondary" id="justify-btn">Justifier une réponse</button>
      <textarea id="draft" rows="3" placeholder="Brouillon de réponse agent (optionnel)"></textarea>
      <div id="results"></div>
    </aside>
    <section>
      <h2 style="margin-top:0;font-size:1rem;">Graphe / contexte</h2>
      <div id="graph-view">Sélectionnez un nœud pour voir le sous-graphe.</div>
      <div class="citations" id="citations"></div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);

    async function loadStatus() {
      const meta = await fetch('/api/status').then((r) => r.json());
      if (!meta.indexedAt) {
        $('status').textContent = 'Index absent — lancez: ted analyze';
        return;
      }
      $('status').innerHTML = `
        Indexé: ${new Date(meta.indexedAt).toLocaleString('fr-FR')}<br>
        Skills: ${meta.skillCount} · Docs: ${meta.documentCount}<br>
        Nœuds: ${meta.nodeCount} · Arêtes: ${meta.edgeCount}<br>
        data.gouv.fr: ${meta.datagouvDatasets} datasets<br>
        Moteur: ${meta.engine}
      `;
    }

    async function search() {
      const q = $('query').value.trim();
      if (!q) return;
      const hits = await fetch(`/api/query?q=${encodeURIComponent(q)}`).then((r) => r.json());
      $('results').innerHTML = hits.map((h) => `
        <div class="hit" data-id="${h.id}">
          <div class="label">${h.label}</div>
          <strong>${h.name}</strong>
          <div style="color:var(--muted);font-size:0.8rem">${h.path || h.excerpt || ''}</div>
        </div>
      `).join('');
      document.querySelectorAll('.hit').forEach((el) => {
        el.onclick = () => showContext(el.dataset.id);
      });
    }

    async function showContext(nodeId) {
      const sub = await fetch(`/api/context/${encodeURIComponent(nodeId)}?depth=2`).then((r) => r.json());
      $('graph-view').textContent = JSON.stringify(sub, null, 2);
    }

    async function justify() {
      const question = $('query').value.trim();
      const draft = $('draft').value.trim();
      if (!question) return;
      const j = await fetch('/api/justify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, draft: draft || undefined }),
      }).then((r) => r.json());
      $('citations').innerHTML = `<p>${j.summary.replace(/\n/g, '<br>')}</p>` +
        j.citations.map((c) => `
          <div class="citation">
            <strong>${c.name}</strong> (${c.label})<br>
            ${c.document || c.excerpt}
          </div>
        `).join('');
    }

    $('search').onclick = search;
    $('query').onkeydown = (e) => e.key === 'Enter' && search();
    $('justify-btn').onclick = justify;
    loadStatus();
  </script>
</body>
</html>
