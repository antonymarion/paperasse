<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TED — graphe fiscal</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --accent: #3b82f6;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1.1rem; margin: 0; }
    header span { color: var(--muted); font-size: 0.85rem; }
    main { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 57px); }
    aside, section { padding: 1rem; overflow: auto; }
    aside { border-right: 1px solid var(--border); background: var(--panel); }
    input, textarea, button {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      margin-bottom: 0.5rem;
    }
    button {
      background: var(--accent);
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary { background: transparent; border: 1px solid var(--border); }
    .stats { font-size: 0.8rem; color: var(--muted); line-height: 1.6; }
    .hit {
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 0.5rem;
      cursor: pointer;
    }
    .hit:hover, .hit.active { border-color: var(--accent); }
    .hit .label { font-size: 0.7rem; color: var(--accent); text-transform: uppercase; }
    #graph-container {
      height: calc(100vh - 120px);
      min-height: 420px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0a0e14;
    }
    .legend { font-size: 0.75rem; color: var(--muted); margin-top: 0.5rem; }
    .citations { margin-top: 1rem; }
    .citation {
      border-left: 3px solid var(--accent);
      padding-left: 0.75rem;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>TED</h1>
    <span>Ontologie fiscal/comptable · force-graph · LadybugDB</span>
  </header>
  <main>
    <aside>
      <div class="stats" id="status">Chargement…</div>
      <hr style="border-color: var(--border)" />
      <input id="query" placeholder="Rechercher (ex: TVA, 2033, dividendes)" />
      <button id="search">Rechercher</button>
      <button class="secondary" id="justify-btn">Justifier une réponse</button>
      <textarea id="draft" rows="3" placeholder="Brouillon de réponse agent (optionnel)"></textarea>
      <div id="results"></div>
    </aside>
    <section>
      <h2 style="margin-top:0;font-size:1rem;">Visualisation du graphe</h2>
      <div id="graph-container"></div>
      <p class="legend">Cliquez un nœud pour centrer · molette pour zoomer · glisser pour déplacer</p>
      <div class="citations" id="citations"></div>
    </section>
  </main>
  <script src="https://unpkg.com/d3@7"></script>
  <script src="https://unpkg.com/force-graph"></script>
  <script src="/app.js"></script>
</body>
</html>
